name: Sync Wildberries & Ozon

on:
  schedule:
    # 8, 14, 20 MSK (UTC+3) → 5, 11, 17 UTC
    - cron: '0 5,11,17 * * *'
  workflow_dispatch:  # ручной запуск из GitHub UI

# Нужно, чтобы workflow мог закоммитить обновлённый data/products.json
# (JSON fallback на случай недоступной БД).
permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # Цены Ozon через headless Chromium — самая дорогая фаза (~1-6 мин).
      # Цены не меняются каждые 6 часов, поэтому в расписании её гоняем только
      # в утреннем прогоне 05:00 UTC; ручной запуск (workflow_dispatch) — полный.
      SYNC_SKIP_OZON_PRICES: ${{ github.event_name == 'schedule' && github.event.schedule != '0 5 * * *' && '1' || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      # Кэш node_modules не используем: он весит ~1.2 ГБ, и распаковка архива
      # в Actions съедает почти всё, что экономит. npm-кэш (~/.npm) setup-node
      # уже восстанавливает, поэтому просто просим npm не лезть в сеть зря.
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}

      - name: Install patchright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx patchright install chromium

      # xvfb нужен для headful-режима Chromium (Variti блокирует headless)
      - name: Install xvfb
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb

      - run: npx prisma generate

      # Preflight прокси Ozon: мёртвый прокси раньше проявлялся только внутри
      # фазы цен — 50 SKU по ~5.7с "Failed to fetch" (≈5 мин) и 0 результата.
      # Теперь это видно сразу и отдельным предупреждением.
      - name: Check Ozon proxy
        if: env.SYNC_SKIP_OZON_PRICES != '1'
        env:
          OZON_PROXY_SERVER: ${{ secrets.OZON_PROXY_SERVER }}
          OZON_PROXY_USER: ${{ secrets.OZON_PROXY_USER }}
          OZON_PROXY_PASS: ${{ secrets.OZON_PROXY_PASS }}
        run: |
          if [ -z "$OZON_PROXY_SERVER" ]; then
            echo "::warning::OZON_PROXY_SERVER не задан — фаза цен Ozon пойдёт без прокси"
            exit 0
          fi
          args=(--max-time 25 -sS -o /dev/null -w '%{http_code}' -x "$OZON_PROXY_SERVER")
          if [ -n "$OZON_PROXY_USER" ]; then
            args+=(-U "$OZON_PROXY_USER:$OZON_PROXY_PASS")
          fi
          code=$(curl "${args[@]}" https://www.ozon.ru/ 2>/dev/null) || code=000
          echo "прокси → ozon.ru: HTTP $code"
          if [ "$code" = "000" ]; then
            echo "::warning::прокси Ozon не отвечает — фаза цен, скорее всего, не сработает"
          fi

      # sync-all.mjs использует официальные WB API (Content + Pricing + Stocks + Analytics)
      # и Ozon Seller API. Ozon-prices фаза ходит через headless Chromium:
      # IP GitHub runners блокируется Variti → трафик идёт через прокси на свой VPS;
      # headless тоже детектится → headful-режим через xvfb (OZON_HEADLESS=0)
      - name: Sync catalog with WB & Ozon
        run: xvfb-run -a node scripts/sync-all.mjs
        env:
          WB_API_KEY: ${{ secrets.WB_API_KEY }}
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
          OZON_PROXY_SERVER: ${{ secrets.OZON_PROXY_SERVER }}
          OZON_PROXY_USER: ${{ secrets.OZON_PROXY_USER }}
          OZON_PROXY_PASS: ${{ secrets.OZON_PROXY_PASS }}
          OZON_HEADLESS: "0"

      # Если БД была недоступна, sync-all.mjs обновляет data/products.json
      # (JSON fallback) — коммитим его, чтобы сайт получил актуальные цены/стоки.
      - name: Commit updated JSON fallback
        run: |
          if git diff --quiet -- data/products.json; then
            echo "data/products.json без изменений — коммит не нужен"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/products.json
          git commit -m "chore(data): обновлён JSON fallback после синка"
          git push
