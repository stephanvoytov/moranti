           Q330 310 400 270
           Q430 280 445 320
           Q470 335 500 305
           Q530 335 555 320
           Q570 280 600 270
           Q670 310 670 430
           L670 560 Z" fill="#1a1a1a"/>
  <!-- Шарики на зубцах -->
  <circle cx="400" cy="248" r="26" fill="#1a1a1a"/>
  <circle cx="500" cy="282" r="30" fill="#1a1a1a"/>
  <circle cx="600" cy="248" r="26" fill="#1a1a1a"/>

  <!-- Прямоугольники (итальянский флаг) -->
  <rect x="160" y="660" width="310" height="150" fill="#009246"/>
  <rect x="530" y="660" width="310" height="150" fill="#ce2b37"/>
</svg>
