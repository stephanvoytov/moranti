name: Sync Wildberries & Ozon

on:
  schedule:
    # 8, 14, 20 MSK (UTC+3) → 5, 11, 17 UTC
    - cron: '0 5,11,17 * * *'
  workflow_dispatch:  # ручной запуск из GitHub UI

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - run: npm ci

      - run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # sync-all.mjs использует официальные WB API (Content + Pricing + Stocks + Analytics)
      # и Ozon Seller API
      - name: Sync catalog with WB & Ozon
        run: node scripts/sync-all.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          WB_API_KEY: ${{ secrets.WB_API_KEY }}
          WB_ANALYTICS_API_KEY: ${{ secrets.WB_ANALYTICS_API_KEY }}
          WB_PRICES_API_KEY: ${{ secrets.WB_PRICES_API_KEY }}
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
