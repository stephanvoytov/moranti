name: CI

on:
  pull_request:
    branches: [master, dev]
  push:
    branches: [dev]

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # prisma generate (postinstall) требует DATABASE_URL на этапе установки
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      # Бандл sync-all генерируется при `npm run build` и заигнорен в git,
      # но sync-runner.ts делает динамический import этого файла. Без сборки
      # `tsc --noEmit` падает с TS2307 (Cannot find module). Собираем бандл
      # перед type check (зеркалит локальный `npm run build`).
      - name: Build sync bundle
        run: node scripts/build-sync-bundle.mjs

      - name: Type check
        run: npx tsc --noEmit